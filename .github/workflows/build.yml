name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build
        shell: powershell
        run: .\Build.ps1
      - name: Test policy and adapter selection
        shell: powershell
        run: .\Test.ps1
      - name: Package
        shell: powershell
        run: .\Package.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ClaudeVpnGuard-windows
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            test-results/*.txt
          if-no-files-found: error
